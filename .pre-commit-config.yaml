# Install once:  pip install pre-commit && pre-commit install
# Run on demand: make pre-commit
#
# Hook versions are pinned to a tag, not a moving branch, so a hook cannot
# change under the repository without a commit.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: mixed-line-ending
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=512"]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
        exclude: ^challenges/
      - id: terraform_validate
        args:
          - --hook-config=--retry-once-with-cleanup=true
          - --args=-no-color
        exclude: ^(challenges|solutions)/
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
          - --args=--minimum-failure-severity=warning
        exclude: ^challenges/
      - id: terraform_checkov
        args:
          - --args=--config-file __GIT_WORKING_DIR__/.checkov.yaml
        exclude: ^challenges/
      - id: terraform_trivy
        args:
          - --args=--severity HIGH,CRITICAL
        exclude: ^challenges/
      - id: terraform_docs
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=true
        exclude: ^(challenges|solutions)/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]
